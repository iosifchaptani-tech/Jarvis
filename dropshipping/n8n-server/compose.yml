# n8n + Postgres + Caddy (automatic HTTPS) for a small VPS (e.g. Hetzner CX23, ~6 EUR/month).
# Setup steps: see ../SETUP.md, part 2.
#
# n8n is pinned on purpose. n8n 3.0 (October 2026) removes old node versions,
# so only upgrade after reading https://docs.n8n.io/changelog/v30-breaking-changes.md
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    environment:
      N8N_DOMAIN: ${N8N_DOMAIN}

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
      PGDATA: /var/lib/postgresql/data
    volumes: ["db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.41.3
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["127.0.0.1:5678:5678"]   # only reachable through Caddy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}   # back this up: without it saved credentials can't be read
      N8N_HOST: ${N8N_DOMAIN}
      N8N_PROTOCOL: https
      N8N_PROXY_HOPS: 1
      N8N_WEBHOOK_URL: https://${N8N_DOMAIN}/
      N8N_EDITOR_BASE_URL: https://${N8N_DOMAIN}/
      GENERIC_TIMEZONE: ${TIMEZONE}
      TZ: ${TIMEZONE}
      EXECUTIONS_TIMEOUT: 900
    volumes: ["n8n_data:/home/node/.n8n"]

volumes:
  caddy_data: {}
  db: {}
  n8n_data: {}
